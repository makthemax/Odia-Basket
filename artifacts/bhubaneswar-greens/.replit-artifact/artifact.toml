kind = "web"
previewPath = "/"
title = "Bhubaneswar Greens - Organic Delivery"
version = "1.0.0"
id = "artifacts/bhubaneswar-greens"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20220

[services.development]
run = "pnpm --filter @workspace/bhubaneswar-greens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhubaneswar-greens", "run", "build" ]
publicDir = "artifacts/bhubaneswar-greens/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20220"
BASE_PATH = "/"
